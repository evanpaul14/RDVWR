name: Update GraphQL hashes

# Reddit's WAF blocks the REST comment endpoints, so comments load through the Android
# app's persisted GraphQL queries (gql_client.py). Their hashes change with app releases;
# this pulls them out of the latest APK and commits gql_hashes.json when they move.
on:
  schedule:
    - cron: '0 4 * * *'  # daily at 4am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download the Reddit APK
        run: |
          gh release download --repo EFForg/apkeep --pattern 'apkeep-x86_64-unknown-linux-gnu' --output apkeep
          chmod +x apkeep
          mkdir apk
          # apk-pure is an unofficial mirror; the APK is only parsed for a 64-hex string
          # (never run), so a tampered one can at worst yield a wrong hash.
          ./apkeep -a com.reddit.frontpage -d apk-pure -o acknowledge_dangers=true apk
          # it serves split bundles as .xapk (a zip of .apk files)
          for x in apk/*.xapk; do [ -e "$x" ] && unzip -q -o "$x" -d apk/x; done
          find apk -name '*.apk'

      - name: Extract hashes
        run: python3 update_gql_hash.py $(find apk -name '*.apk')

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gql_hashes.json
          git diff --cached --quiet || git commit -m "Update GraphQL query hashes"
          git push
