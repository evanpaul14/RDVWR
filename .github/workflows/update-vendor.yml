name: Update vendor JS

# Updates marked / DOMPurify / hls.js within their pinned major versions and opens
# (or refreshes) a PR, so updates are reviewed and CI-tested before reaching main.
# Newer major versions are listed in the run summary and PR body, never installed.
on:
  schedule:
    - cron: '0 3 * * 1'  # every Monday at 3am UTC
  workflow_dispatch:

concurrency:
  group: update-vendor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: auto/vendor-js
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pip install -r requirements.txt

      - name: Update vendored libraries
        run: |
          python3 scripts/update_vendor.py --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Tests
        run: |
          python3 -m pytest tests/ -q
          node --test tests/*.mjs

      - name: Open or update PR
        run: |
          git add static/marked.min.js static/purify.min.js static/hls.min.js static/vendor.json
          if git diff --cached --quiet; then
            echo "No vendor changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "Update vendor JS libraries"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "Update vendor JS libraries" --body-file "$RUNNER_TEMP/summary.md"
          fi
