{# The no-JS fallback, rendered inside <noscript> by index.html. The page route picks
   the view (`ns_view`, one of the partials in this directory) and gives it its data as
   `page` (see routes/page_data.py). Markup reuses the JS app's classes (static/render.js,
   feed.js, postview.js) so style.css styles both. #}
<div class="ns-root{% if ns.layout == 'minimal' %} minimal-mode{% endif %}">
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="/">RDVWR</a>
      <nav class="ns-quicknav">
        <a href="/r/popular">popular</a>
        <a href="/r/all">all</a>
      </nav>
      {# Like the JS header search: "r/<sub>" or "u/<user>" jumps straight there (see
         pages._search_shortcut), anything else searches — within the current subreddit
         when there is one, same as the JS app. #}
      <form class="ns-search-form" action="/search" method="get">
        {% if scope_sub %}<input type="hidden" name="sub" value="{{ scope_sub }}">{% endif %}
        <div class="search-wrap">
          <span class="search-prefix" aria-hidden="true">r /</span>
          <input type="text" name="q" placeholder="{{ 'search r/' ~ scope_sub if scope_sub else 'search reddit' }}" value="{{ page.q if ns_view == 'search' else '' }}" aria-label="Search">
          <button type="submit" title="Search" aria-label="Search">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 10L14 14M11 6A5 5 0 1 1 1 6a5 5 0 0 1 10 0Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </form>
      <a class="ns-settings-btn" href="/settings?{{ {'next': page.next if ns_view == 'settings' else current_url()} | urlencode }}" title="Settings" aria-label="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </header>
  {% include 'noscript/' ~ ns_view ~ '.html' %}
</div>
